<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xuantian World — Web RPG Prototype</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233b;--line:#2b3a5d;--text:#edf3ff;--muted:#9fb0cf;--gold:#e7c76b;--jade:#62d5a5;--red:#ef7777;--blue:#79b9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172443,#080c18 55%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{background:#223253;color:var(--text);border:1px solid #38507d;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{filter:brightness(1.15)}button.primary{background:#315b52;border-color:#4c8d7e}button.danger{background:#512b36;border-color:#7d4653}.wrap{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--gold)}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.card{background:linear-gradient(145deg,var(--panel),#0e1527);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 30px #0004}.stat{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.bar{height:7px;background:#090e19;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--jade)}.grid{display:grid;grid-template-columns:260px 1fr 280px;gap:12px;margin-top:12px}.nav button{width:100%;text-align:left;margin-bottom:7px}.nav small{display:block;color:var(--muted);margin:10px 2px}.main{min-height:650px}.title{font-size:18px;font-weight:750;margin-bottom:10px}.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0f1729}.item b{color:var(--gold)}.log{height:220px;overflow:auto;background:#080d18;border:1px solid var(--line);padding:10px;border-radius:10px;white-space:pre-wrap}.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:#263654;color:#cfe0ff;margin:2px;font-size:11px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.region{padding:9px;border:1px solid var(--line);border-radius:9px;background:#101a2d;cursor:pointer}.region.active{border-color:var(--gold);box-shadow:0 0 0 1px #e7c76b55 inset}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px;z-index:9}.modal>.card{max-width:560px;width:100%}label{display:block;margin:9px 0 4px;color:var(--muted)}input,select{width:100%;padding:10px;background:#0b1221;border:1px solid var(--line);color:var(--text);border-radius:8px}.enemy{display:flex;justify-content:space-between;align-items:center}.combat-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.footer{text-align:center;color:var(--muted);font-size:11px;margin:14px}.hide{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.hud{grid-template-columns:repeat(2,1fr)}.main{min-height:auto}.cols{grid-template-columns:1fr}}@media(max-width:500px){.hud{grid-template-columns:1fr 1fr}.map{grid-template-columns:1fr 1fr}}
</style></head>
<body><div id="app"></div>
<script>
const R=[
['Shenmu Zhou','Kayu/Alam','Kota Shenmu'],['Zhonghua Zhou','Dataran Tengah','Kota Tianjing'],['Canglong Zhou','Pegunungan Pedang','Kota Canglong'],['Chiyan Zhou','Gunung Berapi/Forging','Kota Shendu'],['Canghai Zhou','Kepulauan/Laut','Kota Pelabuhan Haibin'],['Xixuan Zhou','Gurun/Talisman','Kota Huangsha'],['Beihan Zhou','Padang Es/Alkimia Es','Kota Hanbing'],['Youming Zhou','Iblis/Bayangan/Racun','Kota Heian'],['Tiangong Zhou','Airship/Kota Melayang','Benteng Melayang Tiangong'],['Juejing Zhou','Zona Terlarang/Anomali Ruang','Pos Depan Juejing']];
const roots={wood:{n:'Akar Spiritual Kayu Abadi',hp:1.5,atk:1,def:1.2,regen:1.5},fire:{n:'Akar Spiritual Api Purba',hp:.9,atk:1.6,def:.9,regen:.9},wind:{n:'Akar Spiritual Angin & Logam',hp:1,atk:1.4,def:1,regen:1},earth:{n:'Akar Spiritual Tanah & Segel',hp:1.4,atk:.9,def:1.6,regen:1},water:{n:'Akar Spiritual Air & Es Purba',hp:1.2,atk:1.1,def:1.2,regen:1.2}};
const realms=[['Lingquan Jing',100],['Kaimai Jing',500],['Ningyuan Jing',2500],['Lingyi Jing',12500],['Xuantian Jing',62500],['Tongtian Jing',312500],['Faxiang Jing',1562500],['Shenhuang Jing',7812500],['Hunyuan Jing',39062500]];
const professions=['Pengembara','Petani Obat','Penjinak Beast','Alkemis','Penempa','Pembuat Jimat','Pembuat Formasi','Kemudi Airship'];
const factions=['Sekte Induk Shenmu','Sekte Alkimia Danhuang','Sekte Paviliun Pedang Canglong','Istana Api Chiyan','Istana Kemurnian Giok Laut','Kuil Lonceng Emas Gurun','Sekte Istana Salju Abadi Hanbing','Sekte Api Iblis Youming','Perguruan Formasi Ruang Tiangong','Perguruan Eksplorasi Purba Juejing'];
let S=JSON.parse(localStorage.getItem('xw-save')||'null');
function fresh(){return {name:'',root:'wood',prof:'Pengembara',region:0,place:'Kota Shenmu',realm:0,stage:0,qi:100,hp:150,st:120,sat:100,merit:0,sin:0,gold:0,silver:10,copper:0,spirit:2,toxin:0,year:1,month:1,day:1,hour:8,inv:['Pedang Kayu Pemula'],faction:'Bebas',log:[],tab:'home',combat:null,flags:{}}}
if(!S||!S.name){S=fresh();showCreate()}
function save(){localStorage.setItem('xw-save',JSON.stringify(S))}
function addLog(x){S.log.unshift(`[Tahun ${S.year}, ${S.month}/${S.day} ${String(S.hour).padStart(2,'0')}:00] ${x}`);S.log=S.log.slice(0,80);save()}
function qcap(){return realms[S.realm][1]*[1,1.5,2][S.stage]}
function maxhp(){return Math.round(qcap()*.4*roots[S.root].hp)}
function maxst(){return 100+(S.realm+1)*20}
function karma(){return S.merit-S.sin}
function klabel(){let k=karma();return k>=100?'Puji Agung':k>=10?'Kebajikan':k>-10?'Netral':k>-100?'Tercela':'Iblis Purba'}
function tick(h=1){for(let i=0;i<h;i++){S.hour++;if(S.hour>=24){S.hour=0;S.day++;if(S.day>30){S.day=1;S.month++;if(S.month>12){S.month=1;S.year++}}}let fasting=[2,7.2,33.6,72,999][Math.min(S.realm,4)];S.sat=Math.max(0,S.sat-10/fasting);S.st=Math.min(maxst(),S.st+2);S.hp=Math.min(maxhp(),S.hp+maxhp()*.05*roots[S.root].regen*.01);if(S.sat<=0)S.hp=Math.max(0,S.hp-maxhp()*.05)}save()}
function fmt(n){return Math.floor(n).toLocaleString('id-ID')}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div class="brand">🏯 Xuantian <span>World</span> — Web RPG</div><div class="row"><button onclick="save()">💾 Simpan</button><button class="danger" onclick="resetGame()">Reset</button></div></div><div class="hud">${bar('❤️ HP',S.hp,maxhp())}${bar('🔵 Qi',S.qi,qcap())}${bar('⚡ Stamina',S.st,maxst())}${bar('🍚 Satiety',S.sat,100)}<div class="card"><div class="stat"><span>Realm</span><b>${realms[S.realm][0]} · ${['Awal','Tengah','Puncak'][S.stage]}</b></div><div class="stat"><span>Qi Cap</span><b>${fmt(qcap())}</b></div></div></div><div class="grid"><aside class="nav card"><small>JALUR</small>${nav('home','🏠 Dunia')}${nav('map','🗺️ Peta & Perjalanan')}${nav('cult','☯️ Kultivasi')}${nav('combat','⚔️ Pertarungan')}${nav('prof','🧰 Profesi & Inventori')}${nav('faction','🏔️ Faksi')}${nav('shop','💰 Pasar')}${nav('log','📜 Log Dunia')}<small>WAKTU</small><div class="item">Tahun ${S.year}<br>${S.month}/${S.day} · ${String(S.hour).padStart(2,'0')}:00<br><span class="muted">${S.place}, ${R[S.region][0]}</span></div></aside><main class="main">${view()}</main><aside class="card"><div class="title">Profil</div><div class="item"><b>${esc(S.name)}</b><br><span class="muted">${roots[S.root].n}</span><hr><div class="stat"><span>Profesi</span><b>${S.prof}</b></div><div class="stat"><span>Karma</span><b>${karma()} · ${klabel()}</b></div><div class="stat"><span>Currency</span><b>${S.gold} GT · ${S.silver} ST</b></div><div class="stat"><span>Spirit Stone</span><b>${S.spirit} LSS</b></div><div class="stat"><span>Afiliasi</span><b>${S.faction}</b></div></div><div class="title" style="margin-top:12px">Aktivitas</div><div class="log">${S.log.slice(0,12).map(esc).join('\n')}</div></aside></div><div class="footer">Original browser RPG prototype based on the Xuantian World World Bible. Tidak menggunakan aset Tale of Immortal.</div></div>`}
function bar(n,v,m){return `<div class="card"><div class="stat"><span>${n}</span><b>${fmt(v)} / ${fmt(m)}</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%"></i></div></div>`}
function nav(t,l){return `<button class="${S.tab===t?'primary':''}" onclick="S.tab='${t}';render()">${l}</button>`}
function view(){switch(S.tab){case'map':return mapView();case'cult':return cultView();case'combat':return combatView();case'prof':return profView();case'faction':return factionView();case'shop':return shopView();case'log':return `<div class="card"><div class="title">📜 Catatan Dunia</div><div class="log" style="height:600px">${S.log.map(esc).join('\n')}</div></div>`;default:return homeView()}}
function homeView(){return `<div class="card"><div class="title">${S.place}</div><p class="muted">Dunia Xuantian berjalan secara otonom. Pilihanmu mengubah waktu, kondisi tubuh, karma, inventori, dan hubungan dengan faksi.</p><div class="cols"><div class="item"><b>🔎 Eksplorasi</b><p>Cari sumber daya, beast, peluang profesi, atau masalah.</p><button class="primary" onclick="explore()">Eksplorasi · 2 jam</button></div><div class="item"><b>🧘 Meditasi</b><p>Serap Qi dari lingkungan selama 1 jam.</p><button onclick="meditate()">Meditasi · 1 jam</button></div><div class="item"><b>🍜 Istirahat & Makan</b><p>Memulihkan kondisi fisik dengan makanan mortal.</p><button onclick="eat()">Makan · 1 jam</button></div><div class="item"><b>⚔️ Bahaya terdekat</b><p>Encounter tempur muncul saat eksplorasi atau event tertentu.</p><button onclick="spawnCombat()">Cari tantangan</button></div></div></div>`}
function mapView(){return `<div class="card"><div class="title">🗺️ Sepuluh Zhou Xuantian</div><div class="map">${R.map((r,i)=>`<div class="region ${i===S.region?'active':''}" onclick="travel(${i})"><b>${r[0]}</b><br><span class="muted">${r[1]}</span><br><small>${r[2]}</small></div>`).join('')}</div><p class="muted">Perjalanan lintas wilayah memakai ekonomi airship Xuantian; rute jauh memerlukan Spirit Stone.</p></div>`}
function cultView(){let chance=70;if(S.stage===2&&S.realm<8)chance=S.realm<6?40:20;let req=S.stage<2?'Sub-stage':'Major/High Realm';return `<div class="card"><div class="title">☯️ Jalan Kultivasi</div><div class="item"><b>${realms[S.realm][0]}</b> · ${['Awal','Tengah','Puncak'][S.stage]}<br>Qi Cap ${fmt(qcap())}<br><span class="muted">Penerobosan berikut: ${req} · peluang dasar ${chance}%</span></div><div class="row" style="margin-top:10px"><button class="primary" onclick="meditate()">Meditasi 1 jam</button><button onclick="breakthrough()">⚡ Coba Terobosan</button></div><hr><div class="item">Toxin Dantian: <b>${S.toxin}%</b><br>Karma: <b>${karma()} (${klabel()})</b><p class="muted">Realm 7–9 memicu tribulasi sesuai World Bible.</p></div></div>`}
function profView(){return `<div class="card"><div class="title">🧰 Profesi & Inventori</div><div class="cols"><div class="item"><b>Profesi</b><br>${S.prof}<p class="muted">Profesi memengaruhi aktivitas, loot, dan aksi tempur khusus.</p><select onchange="S.prof=this.value;save();render()">${professions.map(x=>`<option ${x===S.prof?'selected':''}>${x}</option>`).join('')}</select></div><div class="item"><b>Inventori</b>${S.inv.length?'<ul>'+S.inv.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="muted">Kosong</p>'}</div></div></div>`}
function factionView(){return `<div class="card"><div class="title">🏔️ Sekte & Perguruan</div><p class="muted">Sekte berfungsi sebagai organisasi besar; perguruan berfokus pada ilmu spesialis. Pilih afiliasi untuk prototype.</p><div class="list">${factions.map(f=>`<div class="item"><b>${f}</b><br><button onclick="join('${f.replace(/'/g,"\\'")}')">${S.faction===f?'✓ Bergabung':'Bergabung'}</button></div>`).join('')}</div></div>`}
function shopView(){let items=[['Ransum Mortal',2,'silver'],['Pil Pemulih Sederhana',1,'spirit'],['Jimat Penjinak Beast Pemula',1,'spirit'],['Ingot Besi Spirit',1,'gold']];return `<div class="card"><div class="title">💰 Pasar Lokal</div><p class="muted">Harga prototype mengikuti mata uang dan konsep ekonomi Xuantian.</p><div class="list">${items.map((x,i)=>`<div class="item"><b>${x[0]}</b> · ${x[1]} ${x[2]==='silver'?'ST':x[2]==='gold'?'GT':'LSS'} <button style="float:right" onclick="buy(${i})">Beli</button></div>`).join('')}</div></div>`}
function combatView(){if(!S.combat)return `<div class="card"><div class="title">⚔️ Pertarungan</div><p class="muted">Belum ada lawan. Masuk pertarungan dari eksplorasi atau tombol tantangan.</p><button class="primary" onclick="spawnCombat()">Mulai Pertarungan</button></div>`;let e=S.combat.e;return `<div class="card"><div class="title">⚔️ Pertarungan Turn-Based</div><div class="item enemy"><div><b>${e.name}</b><br><span class="muted">Realm ${e.realm+1} · HP ${fmt(e.hp)}/${fmt(e.maxhp)}</span></div><div>${e.root}</div></div><div class="bar"><i style="width:${Math.max(0,e.hp/e.maxhp*100)}%"></i></div><p>Giliran: <b>${S.combat.turn==='player'?'Kamu':'Musuh'}</b></p><div class="combat-actions">${S.combat.turn==='player'?`<button onclick="attack()">🗡️ Serangan</button><button onclick="skill()">✨ Teknik Akar</button><button onclick="defend()">🛡️ Bertahan</button><button onclick="flee()">🏃 Kabur</button>`:'<button disabled>Menunggu aksi musuh…</button>'}</div><div class="log" style="margin-top:10px;height:170px">${S.combat.log.map(esc).join('\n')}</div></div>`}
function explore(){tick(2);let roll=Math.random();if(roll<.35){addLog('Menemukan bahan profesi lokal.');S.inv.push(S.region===0?'Benih Lingzhi Hijau':'Bahan Spirit Tier 1');}else if(roll<.68){addLog('Jejak Spirit Beast ditemukan. Bahaya mendekat.');spawnCombat();return}else if(roll<.82){S.merit+=10;addLog('Membantu warga fana yang tersesat. +10 Merit.')}else{S.sin+=5;addLog('Kecerobohanmu merusak area spirit. +5 Sin.')}render()}
function meditate(){let gain=Math.max(1,Math.floor(qcap()*.02*(1+.1)));S.qi=Math.min(qcap(),S.qi+gain);tick(1);addLog(`Meditasi memulihkan ${gain} Qi.`);render()}
function eat(){S.sat=Math.min(100,S.sat+35);S.hp=Math.min(maxhp(),S.hp+maxhp()*.1);tick(1);addLog('Makan dan beristirahat. Kondisi membaik.');render()}
function breakthrough(){if(S.realm===8&&S.stage===2){addLog('Hunyuan Jing Puncak telah mencapai batas prototype.');render();return}let base=S.stage<2?70:(S.realm<6?40:20);let chance=base+(S.sat>50?5:0)+(S.toxin>30?-20:0);let roll=Math.random()*100;if(roll<chance){if(S.stage<2)S.stage++;else{S.realm++;S.stage=0}S.qi=qcap();S.hp=maxhp();addLog(`Terobosan berhasil! Kini ${realms[S.realm][0]} ${['Awal','Tengah','Puncak'][S.stage]}.`)}else{S.qi=Math.floor(S.qi*.5);S.toxin=Math.min(100,S.toxin+10);addLog(`Terobosan gagal (peluang ${chance.toFixed(0)}%). Qi terkuras 50%.`)}tick(1);render()}
function spawnCombat(){let er=Math.max(0,Math.min(8,S.realm+(Math.random()<.7?0:(Math.random()<.5?1:-1))));let mh=Math.round(realms[er][1]*.4*(.9+Math.random()*.4));S.combat={turn:'player',e:{name:['Beast Spirit','Bandit Kultivator','Shadow Poison Beast','Spirit Guardian'][Math.floor(Math.random()*4)],realm:er,root:'Unknown',maxhp:mh,hp:mh,atk:realms[er][1]*.15*(.9+Math.random()*.2)},log:['Pertarungan dimulai.']};S.tab='combat';render()}
function playerAtk(mult=1){let ap=qcap()*.15*roots[S.root].atk*(1+(S.inv.includes('Pedang Kayu Pemula')?.1:0));let def=S.combat.e.realm*5;let hit=Math.min(.95,Math.max(.1,.70+(S.realm-S.combat.e.realm)*.05));if(Math.random()>hit){S.combat.log.unshift('Seranganmu meleset.');return}let dmg=Math.max(1,ap*mult-def);if(Math.random()<.05+(roots[S.root]===roots.wind?.05:0))dmg*=1.5;S.combat.e.hp-=dmg;S.combat.log.unshift(`Serangan mengenai lawan: ${fmt(dmg)} damage.`)}
function enemyTurn(){if(S.combat.e.hp<=0)return;let def=qcap()*.05*roots[S.root].def;let dmg=Math.max(1,S.combat.e.atk-def);S.hp-=dmg;S.combat.log.unshift(`${S.combat.e.name} menyerang: ${fmt(dmg)} damage.`);if(S.hp<=0){S.hp=1;S.combat=null;addLog('Kamu kalah dan nyaris tewas.');S.tab='home';return}S.combat.turn='player'}
function finishCombat(){if(S.combat&&S.combat.e.hp<=0){let gain=Math.max(1,(S.combat.e.realm+1));S.spirit+=gain;S.merit+=5;addLog(`Menang melawan ${S.combat.e.name}. +${gain} LSS-equivalent loot, +5 Merit.`);S.combat=null;S.tab='home'}}
function attack(){playerAtk(1);finishCombat();if(S.combat){S.combat.turn='enemy';enemyTurn()}render()}
function skill(){if(S.qi<10){addLog('Qi tidak cukup.');render();return}S.qi-=10;playerAtk(1.7);finishCombat();if(S.combat){S.combat.turn='enemy';enemyTurn()}render()}
function defend(){S.hp=Math.min(maxhp(),S.hp+maxhp()*.03);S.combat.log.unshift('Kamu bertahan dan menstabilkan tubuh.');S.combat.turn='enemy';enemyTurn();render()}
function flee(){if(Math.random()<.65){addLog('Berhasil kabur dari pertarungan.');S.combat=null;S.tab='home'}else{S.combat.turn='enemy';enemyTurn()}render()}
function travel(i){if(i===S.region){return}let cost=Math.abs(i-S.region)>2?28:15;if(S.spirit<cost){addLog(`Spirit Stone tidak cukup untuk perjalanan lintas wilayah (${cost} LSS).`);render();return}S.spirit-=cost;S.region=i;S.place=R[i][2];tick(3);addLog(`Tiba di ${S.place}, ${R[i][0]}.`);render()}
function join(f){S.faction=f;addLog(`Afiliasi berubah menjadi ${f}.`);render()}
function buy(i){let p=[['Ransum Mortal',2,'silver'],['Pil Pemulih Sederhana',1,'spirit'],['Jimat Penjinak Beast Pemula',1,'spirit'],['Ingot Besi Spirit',1,'gold']][i];if(p[2]==='silver'&&S.silver>=p[1])S.silver-=p[1];else if(p[2]==='spirit'&&S.spirit>=p[1])S.spirit-=p[1];else if(p[2]==='gold'&&S.gold>=p[1])S.gold-=p[1];else{addLog('Currency tidak cukup.');render();return}S.inv.push(p[0]);addLog(`Membeli ${p[0]}.`);render()}
function resetGame(){if(confirm('Hapus save lokal dan mulai karakter baru?')){localStorage.removeItem('xw-save');S=fresh();showCreate()}}
function showCreate(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="create"><div class="card"><div class="title">🌌 Memasuki Xuantian World</div><p class="muted">Prototype roguelite/RPG kultivasi original dengan data World Bible Xuantian.</p><label>Nama karakter</label><input id="cn" value="Ryxian"><label>Akar Spiritual</label><select id="cr">${Object.entries(roots).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><label>Profesi</label><select id="cp">${professions.map(x=>`<option>${x}</option>`).join('')}</select><label>Lokasi awal</label><select id="cl">${R.map((x,i)=>`<option value="${i}">${x[0]} — ${x[2]}</option>`).join('')}</select><button class="primary" style="width:100%;margin-top:12px" onclick="startGame()">Mulai Perjalanan</button></div></div>`)}
function startGame(){S=fresh();S.name=document.getElementById('cn').value.trim()||'Pengembara';S.root=document.getElementById('cr').value;S.prof=document.getElementById('cp').value;S.region=+document.getElementById('cl').value;S.place=R[S.region][2];S.hp=maxhp();S.qi=qcap();S.st=maxst();addLog('Memulai perjalanan di Xuantian World.');document.getElementById('create').remove();render()}
render();
</script></body></html>
